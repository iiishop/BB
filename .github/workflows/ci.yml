name: CI

# PR 门禁。三层：Flutter 客户端（analyze + widget + Linux integration）、
# FastAPI 服务端（pytest + ruff）、DSH MCP 插件（pytest + ruff）。
# 三个子系统都可能尚未合并进 main：缺目录就整段跳过，不伪装成通过。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: 范围与版本
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.gate.outputs.flutter }}
      android: ${{ steps.gate.outputs.android }}
      server: ${{ steps.gate.outputs.server }}
      plugin: ${{ steps.gate.outputs.plugin }}
      admin_ui: ${{ steps.gate.outputs.admin_ui }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: 探测子系统与版本
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # 标准库回归留在 plan 内；无需安装产品依赖或新增 job。
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/plan.py >> "$GITHUB_OUTPUT"
          version="$(grep -m1 '^version:' client/pubspec.yaml 2>/dev/null | awk '{print $2}' | cut -d+ -f1 || true)"
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter 三层 QA
    needs: plan
    if: needs.plan.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 系统依赖（Linux 桌面构建 + 无头显示）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb ffmpeg

      - name: 三层 QA runner（analyze / widget / Linux integration）
        env:
          QA_REQUIRE_INTEGRATION: '1'
          QA_REQUIRE_WIDGET_TESTS: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            bash scripts/run_flutter_tests.sh client

      - name: 上传 QA 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            client/.qa-artifacts/**/results.tsv
            client/.qa-artifacts/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  android-apk:
    name: Android release 构建
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # 只验证 Android 侧改动没把 release 构建弄坏；只编 arm64 一个架构，
      # 三个 ABI 走的是同一份 gradle 配置。
      - name: flutter build apk --release
        working-directory: client
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm64

  server:
    name: 服务端 pytest
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # 3.13：server/openapi.json 的快照是在 3.13 上生成的，
          # 3.12 的 HTTPStatus 短语是 "Unprocessable Entity"，3.13 改成了
          # "Unprocessable Content"，用 3.12 会让快照测试误报。
          python-version: '3.13'
          enable-cache: true
      - name: 依赖
        working-directory: server
        run: uv sync --frozen
      - name: pytest
        working-directory: server
        run: uv run --locked pytest -q --junitxml=.evidence/server-ci.xml
      - name: ruff
        working-directory: server
        # 只检查源码与测试：runtime-patch/ 与 qa-evidence/ 是 QA 过程产物，不是产品代码
        run: uv run --locked ruff check src tests contract/src/bb_auth_contract/admin.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-junit
          path: server/.evidence/server-ci.xml

  admin-ui:
    name: Vue 与产品管理入口
    needs: plan
    if: needs.plan.outputs.admin_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
      - name: 规范 DTO 与真实服务端锁定环境
        run: uv sync --project server --locked
      - name: Vue 构建、类型与含旧幂等键反例的测试
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --reporter=default --reporter=junit --outputFile=.evidence/unit.xml
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: 产品静态挂载、真实 SSE 和外部替身编排（无云端副作用）
        run: node server/probes/public_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-ui-evidence
          path: |
            admin-ui/.evidence/unit.xml
            server/.evidence/browser-b-*/results.json
            server/.evidence/browser-b-*/*/configuration.png
            server/.evidence/browser-b-*/*/confirmation.png

  windows-helper:
    name: Windows 固定助手请求验证（不安装或注册服务）
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --project server --locked
      - run: uv run --project server --locked pytest server/platform-tests/windows_helper.py -q --junitxml=server/.evidence/windows-helper.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-helper-junit
          path: server/.evidence/windows-helper.xml

  plugin:
    name: DSH 插件 pytest
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
      - name: 依赖（插件依赖 server/contract，仓库整份 checkout）
        working-directory: dsh-plugin
        run: uv sync --frozen
      - name: pytest
        working-directory: dsh-plugin
        run: uv run pytest -q
      - name: ruff
        working-directory: dsh-plugin
        # runtime-patch/ 下是 Sentinel 的 QA 脚手架，不参与 lint
        run: uv run ruff check src tests
