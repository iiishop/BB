name: CI

# PR 门禁。三层：Flutter 客户端（analyze + widget + Linux integration）、
# FastAPI 服务端（pytest + ruff）、DSH MCP 插件（pytest + ruff）。
# 三个子系统都可能尚未合并进 main：缺目录就整段跳过，不伪装成通过。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: 范围与版本
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.gate.outputs.flutter }}
      server: ${{ steps.gate.outputs.server }}
      plugin: ${{ steps.gate.outputs.plugin }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: 探测子系统与版本
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # 目录存在、且本次改动涉及该目录才跑（push / dispatch 全跑）
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" || true
            diff_range="origin/${BASE_REF}...HEAD"
          else
            diff_range=""
          fi
          flag() {
            local dir="$1" prefix="$2"
            if [ ! -e "$dir" ]; then echo "false"; return; fi
            if [ -z "$diff_range" ]; then echo "true"; return; fi
            if git diff --name-only "$diff_range" | grep -q "^${prefix}"; then
              echo "true"
            else
              echo "false"
            fi
          }
          echo "flutter=$(flag client client/)" >> "$GITHUB_OUTPUT"
          echo "server=$(flag server server/)" >> "$GITHUB_OUTPUT"
          echo "plugin=$(flag dsh-plugin dsh-plugin/)" >> "$GITHUB_OUTPUT"
          version="$(grep -m1 '^version:' client/pubspec.yaml 2>/dev/null | awk '{print $2}' | cut -d+ -f1 || true)"
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter 三层 QA
    needs: plan
    if: needs.plan.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 系统依赖（Linux 桌面构建 + 无头显示）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb ffmpeg

      - name: 三层 QA runner（analyze / widget / Linux integration）
        env:
          QA_REQUIRE_INTEGRATION: '1'
          QA_REQUIRE_WIDGET_TESTS: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            bash scripts/run_flutter_tests.sh client

      - name: 上传 QA 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            client/.qa-artifacts/**/results.tsv
            client/.qa-artifacts/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: 服务端 pytest
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # 3.13：server/openapi.json 的快照是在 3.13 上生成的，
          # 3.12 的 HTTPStatus 短语是 "Unprocessable Entity"，3.13 改成了
          # "Unprocessable Content"，用 3.12 会让快照测试误报。
          python-version: '3.13'
          enable-cache: true
      - name: 依赖
        working-directory: server
        run: uv sync --frozen
      - name: pytest
        working-directory: server
        run: uv run pytest -q
      - name: ruff
        working-directory: server
        # 只检查源码与测试：runtime-patch/ 与 qa-evidence/ 是 QA 过程产物，不是产品代码
        run: uv run ruff check src tests

  plugin:
    name: DSH 插件 pytest
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
      - name: 依赖（插件依赖 server/contract，仓库整份 checkout）
        working-directory: dsh-plugin
        run: uv sync --frozen
      - name: pytest
        working-directory: dsh-plugin
        run: uv run pytest -q
      - name: ruff
        working-directory: dsh-plugin
        # runtime-patch/ 下是 Sentinel 的 QA 脚手架，不参与 lint
        run: uv run ruff check src tests
