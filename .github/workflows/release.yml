name: Release

# main 推送 → 全平台构建，产物作为 workflow artifact（不进 Release）。
# 打 v* tag → 同样的构建，另外建 GitHub Release 并附 SHA256SUMS，最后回下载校验。
# 版本号唯一来源：client/pubspec.yaml 的 version 字段。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  meta:
    name: 版本与发布判定
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      package_version: ${{ steps.v.outputs.package_version }}
      short_sha: ${{ steps.v.outputs.short_sha }}
      has_client: ${{ steps.v.outputs.has_client }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: 读版本 / 校验 tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci/release_meta.py >> "$GITHUB_OUTPUT"

  # The local reusable workflow is resolved at this exact commit, not main.
  # Only tags rerun full CI; test packages do not double the normal CI cost.
  ci:
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux (deb + rpm + tar)
    needs: meta
    if: needs.meta.outputs.has_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libblkid-dev liblzma-dev libstdc++-12-dev rpm
      - name: flutter build linux
        working-directory: client
        run: |
          flutter pub get
          flutter build linux --release
      - name: 打 deb + rpm
        run: |
          set -euo pipefail
          # 只认 release/bundle：build/linux 下还有 intermediates_do_not_run/bb_mobile，
          # 它是编译中间产物（24 KB 的空壳），find 到它会打出 6 KB 的废包。
          bundle_dir="$(ls -d client/build/linux/*/release/bundle 2>/dev/null | head -1)"
          [ -n "$bundle_dir" ] || { echo "::error::找不到 release/bundle"; exit 1; }
          [ -d "$bundle_dir/lib" ] && [ -d "$bundle_dir/data" ] \
            || { echo "::error::bundle 缺 lib/ 或 data/，不是完整的 Flutter bundle"; exit 1; }
          kb="$(du -sk "$bundle_dir" | cut -f1)"
          [ "$kb" -gt 5000 ] || { echo "::error::bundle 只有 ${kb}KB，明显不完整"; exit 1; }
          echo "bundle=$bundle_dir (${kb}KB)"
          bash scripts/ci/package-linux.sh \
            --bundle "$bundle_dir" --out dist --version "$VERSION" --deb --rpm
      - name: 校验包体积（防"绿但空"）
        run: |
          set -euo pipefail
          for f in dist/*.deb dist/*.rpm dist/*linux*.tar.gz; do
            kb="$(du -sk "$f" | cut -f1)"
            echo "$f ${kb}KB"
            [ "$kb" -gt 5000 ] || { echo "::error::$f 只有 ${kb}KB，产物不完整"; exit 1; }
          done
      - name: 打包 bundle 供 Arch 作业复用
        run: |
          set -euo pipefail
          bundle_dir="$(ls -d client/build/linux/*/release/bundle 2>/dev/null | head -1)"
          tar -C "$(dirname "$bundle_dir")" -czf dist/bundle.tar.gz "$(basename "$bundle_dir")"
      - uses: actions/upload-artifact@v4
        with:
          name: bb-linux-${{ needs.meta.outputs.short_sha }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*linux*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bb-linux-bundle-${{ needs.meta.outputs.short_sha }}
          path: dist/bundle.tar.gz
          retention-days: 3

  arch:
    name: Arch Linux (.pkg.tar.zst)
    needs: [meta, linux]
    if: needs.meta.outputs.has_client == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.meta.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - name: 装打包工具
        run: pacman -Sy --noconfirm --needed base-devel >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: bb-linux-bundle-${{ needs.meta.outputs.short_sha }}
          path: /tmp/art
      - name: makepkg（非 root 用户）
        run: |
          set -euo pipefail
          useradd -m builder
          tar -C /tmp -xzf /tmp/art/bundle.tar.gz
          [ -d /tmp/bundle/lib ] && [ -d /tmp/bundle/data ] \
            || { echo "::error::解出来的 bundle 不完整（缺 lib/ 或 data/）"; exit 1; }
          cp -r "$GITHUB_WORKSPACE/scripts" /tmp/ci-scripts
          chmod -R a+rX /tmp/bundle /tmp/ci-scripts
          mkdir -p /tmp/out && chown builder /tmp/out
          su builder -c "bash /tmp/ci-scripts/ci/package-arch.sh --bundle /tmp/bundle --out /tmp/out --version $VERSION"
          mkdir -p dist && cp /tmp/out/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bb-arch-${{ needs.meta.outputs.short_sha }}
          path: dist/*.pkg.tar.zst
          retention-days: 14

  windows:
    name: Windows (zip)
    needs: meta
    if: needs.meta.outputs.has_client == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.meta.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: 下载并校验固定源码（FFmpeg / zlib）
        run: python scripts/ci/fetch_ffmpeg_sources.py --dest .ffmpeg-src
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            make
      - name: 从固定源码构建最小 FFmpeg（仅解码 + PNG 封面）
        shell: msys2 {0}
        env:
          BB_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/build_ffmpeg_windows.sh --sources .ffmpeg-src --dest client/windows/ffmpeg
      - name: 读取内置 FFmpeg 构建 hash
        id: ffmpeg
        shell: pwsh
        run: |
          $line = Select-String -Path client/windows/ffmpeg/BUILD-MANIFEST.txt -Pattern '^ffmpeg_exe_sha256=' | Select-Object -First 1
          $sha = $line.Line.Split('=', 2)[1]
          "sha=$sha" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT
      - name: flutter build windows
        working-directory: client
        run: |
          flutter pub get
          flutter build windows --release
      - name: Windows 单元测试（应用目录解析 + 粘贴准备）
        working-directory: client
        run: flutter test test/ffmpeg_tool_test.dart test/chat_clipboard_paste_test.dart
      - name: 打包、ZIP 内容检查与无系统 FFmpeg 冒烟
        shell: pwsh
        run: |
          python scripts/ci/package_windows.py `
            --bundle client/build/windows/x64/runner/Release `
            --out dist `
            --version "$env:VERSION" `
            --name "bb-$env:VERSION-windows-x64" `
            --expected-ffmpeg-sha256 "${{ steps.ffmpeg.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bb-windows-${{ needs.meta.outputs.short_sha }}
          path: dist/*.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-evidence-${{ needs.meta.outputs.short_sha }}
          path: |
            dist/package-summary.json
            dist/package-windows.log
            client/windows/ffmpeg/BUILD-MANIFEST.txt
          retention-days: 14

  macos:
    name: macOS (zip)
    needs: meta
    if: needs.meta.outputs.has_client == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: 确保 macos 平台目录存在
        working-directory: client
        run: |
          if [ ! -d macos ]; then
            echo "::warning::client/macos 不存在，首次生成脚手架（应尽快提交进仓库）"
            flutter create --platforms=macos --org ai.bb .
          fi
      - name: flutter build macos
        working-directory: client
        run: |
          flutter pub get
          flutter build macos --release
      - name: 压缩 .app
        run: |
          set -euo pipefail
          mkdir -p dist
          app="$(find client/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "::error::没有找到 .app"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/bb-$VERSION-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bb-macos-${{ needs.meta.outputs.short_sha }}
          path: dist/*.zip
          retention-days: 14

  android:
    name: Android (apk + aab)
    needs: meta
    if: needs.meta.outputs.has_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: flutter build apk / appbundle
        working-directory: client
        run: |
          flutter pub get
          # 按 CPU 架构拆分：整包会把三个架构的 libflutter.so + libapp.so 全塞进去，
          # 54MB 里有大约 2/3 是用户设备根本用不到的那两个架构。
          flutter build apk --release --split-per-abi
          flutter build appbundle --release
      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="client/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$src" ] || { echo "::error::缺少 ${abi} 的 apk"; exit 1; }
            kb="$(du -sk "$src" | cut -f1)"
            # 单架构包正常在 16-21MB；明显偏小说明 bundle 不完整
            [ "$kb" -gt 12000 ] || { echo "::error::${abi} apk 只有 ${kb}KB，产物不完整"; exit 1; }
            cp "$src" "dist/bb-$VERSION-android-${abi}.apk"
          done
          cp client/build/app/outputs/bundle/release/app-release.aab "dist/bb-$VERSION-android.aab"
          ls -la dist
          echo "::notice::apk 按 abi 拆分，arm64-v8a 覆盖绝大多数 64 位设备；apk 用仓库自带的 debug keystore 签名（可安装、不可上架）"
      - uses: actions/upload-artifact@v4
        with:
          name: bb-android-${{ needs.meta.outputs.short_sha }}
          path: |
            dist/*.apk
            dist/*.aab
          retention-days: 14

  release:
    name: 建 Release
    permissions:
      contents: write
    needs: [meta, ci, linux, arch, windows, macos, android]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bb-*
          path: dist
          merge-multiple: true
      - name: 去掉中间产物 + 生成校验和
        run: |
          set -euo pipefail
          cd dist
          rm -f bundle.tar.gz
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          generate_release_notes: true
          body_path: docs/RELEASE-NOTES.md

  verify:
    name: 回下载校验
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - name: 拉回 Release 制品并核对校验和
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir . --clobber
          ls -la
          sha256sum -c SHA256SUMS
