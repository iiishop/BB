name: Windows test package

# 固定候选的 Windows 测试包：自带 FFmpeg（LGPL），不依赖 runner/user PATH。
# PR 与手动触发都会产出同一个可下载 artifact；不建 Release、不部署。

on:
  pull_request:
    paths:
      # Actual Windows payload + shared Dart code/dependencies. Keep assets
      # covered when pubspec adds them; unrelated platform/docs/QA changes stay cheap.
      - 'client/lib/**'
      - 'client/assets/**'
      - 'client/windows/**'
      - 'client/pubspec.*'
      - 'client/.metadata'
      - 'client/analysis_options.yaml'
      - 'client/test/ffmpeg_tool_test.dart'
      - 'client/test/chat_clipboard_paste_test.dart'
      - 'client/test/support/**'
      - 'client/test/fixtures/**'
      - 'scripts/ci/build_ffmpeg_windows.sh'
      - 'scripts/ci/fetch_ffmpeg_sources.py'
      - 'scripts/ci/ffmpeg_pins.py'
      - 'scripts/ci/package_windows.py'
      - 'scripts/ci/ffmpeg_cache.py'
      - 'scripts/ci/test_*ffmpeg*.py'
      - 'scripts/ci/test_package_windows.py'
      - 'scripts/ci/test_windows_workflow.py'
      - 'scripts/ci/fixtures/**'
      - '.github/workflows/windows-test-package.yml'
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read  # Discover only exact-input caches in this ref, never another PR.

jobs:
  windows-test-package:
    name: Windows 自带 FFmpeg 测试包
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 读取客户端版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version:' client/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          [ -n "$version" ]
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 记录 runner 自带的 FFmpeg（仅诊断，不作为验收依据）
        shell: pwsh
        run: |
          $cmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($cmd) { "SYSTEM_FFMPEG=$($cmd.Source)" } else { "SYSTEM_FFMPEG=none" }

      - name: Resolve FFmpeg cache inputs and toolchain snapshot
        id: ffmpeg-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/ffmpeg_cache.py plan

      - name: Restore exact FFmpeg dependency cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: client/windows/ffmpeg
          key: ${{ steps.ffmpeg-inputs.outputs.key }}

      - name: 下载并校验固定源码（FFmpeg / zlib）
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: python scripts/ci/fetch_ffmpeg_sources.py --dest .ffmpeg-src

      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            make

      - name: 从固定源码构建最小 FFmpeg（仅解码 + PNG 封面）
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          BB_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/build_ffmpeg_windows.sh --sources .ffmpeg-src --dest client/windows/ffmpeg

      - name: Verify FFmpeg tree, manifest, licenses and executable hash
        id: ffmpeg
        env:
          CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.ffmpeg-inputs.outputs.key }}
          CACHE_PREFIX: ${{ steps.ffmpeg-inputs.outputs.prefix }}
          TOOLCHAIN_DIGEST: ${{ steps.ffmpeg-inputs.outputs.toolchain }}
        run: python scripts/ci/ffmpeg_cache.py verify

      - name: Windows release 构建（Release 缺少内置 FFmpeg 会直接失败）
        working-directory: client
        run: |
          flutter pub get
          flutter build windows --release

      - name: Windows 单元测试（应用目录解析 + 粘贴准备）
        working-directory: client
        run: flutter test test/ffmpeg_tool_test.dart test/chat_clipboard_paste_test.dart

      - name: 打包、ZIP 内容检查、无系统 FFmpeg 冒烟与中文/空格路径复验
        run: >
          python scripts/ci/package_windows.py
          --bundle client/build/windows/x64/runner/Release
          --out dist
          --version ${{ steps.version.outputs.version }}
          --name bb-${{ steps.version.outputs.version }}-windows-x64-dea477
          --expected-ffmpeg-sha256 ${{ steps.ffmpeg.outputs.sha }}

      - name: 复核 artifact 与校验和
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          python - <<'EOF'
          import hashlib
          import json
          from pathlib import Path

          parts = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").split()
          digest, name = parts[0], parts[1]
          archive = Path("dist") / name
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == digest, (actual, digest)
          summary = json.loads(
              Path("dist/package-summary.json").read_text(encoding="utf-8")
          )
          smoke = summary["extracted_recheck"]["smoke"]
          assert smoke["status"] == "PASS", summary
          assert summary["archive"]["zip_bytes"] > 20 * 1024 * 1024, summary
          print("zip:", name, "sha256:", digest)
          print("bundled ffmpeg:", smoke["ffmpeg_version"])
          EOF

      # Save only after the unchanged final bundle + extracted ZIP smoke passed.
      - name: Save verified FFmpeg dependency cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: client/windows/ffmpeg
          key: ${{ steps.ffmpeg.outputs.save_key }}

      - name: 上传 Windows 测试包
        uses: actions/upload-artifact@v4
        with:
          name: bb-windows-test-package
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/package-summary.json
          retention-days: 14

      - name: 上传打包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-windows-package-evidence
          path: |
            dist/package-windows.log
            dist/package-summary.json
            client/windows/ffmpeg/BUILD-MANIFEST.txt
          if-no-files-found: ignore
          retention-days: 14
